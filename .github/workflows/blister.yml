name: Atualiza Blíster

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lê o feed do Substack
        run: python3 scripts/blister.py
      - name: Publica se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- blister.json; then echo "sem novidades"; exit 0; fi
          git config user.name "Blíster (automático)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blister.json
          git commit -m "Blíster: atualiza edições"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
